name: Flor
type: theme
description: Custom theme for Flor.
base theme: claro
core_version_requirement: ^10 || ^11

libraries:
  - flor/global-theming

libraries-extend:
  core/drupal.dialog:
    - flor/drupal.dialog

libraries-override:
  claro/claro.drupal.dialog:
    css:
      theme:
        css/components/dialog.css: false

regions:
  header_top: Header Top
  navigation: Navigation
  content_top: Content Top
  sidebar: Sidebar
  content: Content
  footer: Footer

ckeditor5-stylesheets:
  - components/global/public/css/ckeditor.css
