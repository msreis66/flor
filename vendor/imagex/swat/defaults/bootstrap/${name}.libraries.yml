    components/global/public/js/global.js: { minified: true }
    components/global/public/js/bootstrap.js: { minified: true }
  css:
    theme:
      components/global/public/css/global.css: { minified: true }
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once

header:
