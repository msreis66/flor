version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/html/{APP_NAME}
permissions:
  - object: /var/www/html/{APP_NAME}
    owner: ec2-user
    group: apache
    type:
      - directory
      - file
hooks:
